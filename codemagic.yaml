workflows:
  android-debug:
    name: LORD'S AEGIS APK
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Build Debug APK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          gradle assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
